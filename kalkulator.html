<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SI PASAR - Kalkulator Kasir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 flex justify-center items-start antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Main Mobile Container Simulator -->
  <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-28 border-x border-slate-200/80">

    <!-- Header Utama -->
    <header class="px-5 py-4 bg-white/95 backdrop-blur-md sticky top-0 z-20 border-b border-slate-100 flex justify-between items-center shadow-xs">
      <div class="flex items-center gap-1">
        <span class="font-extrabold text-2xl tracking-tight text-amber-500">SI</span>
        <span class="font-extrabold text-2xl tracking-tight text-emerald-700">PASAR</span>
      </div>
     <!-- KANAN ATAS: Profil User -->
      <div class="flex items-center gap-2">
        <div class="text-right">
          <div class="flex items-center gap-1.5 justify-end">
            <span class="text-xs font-bold text-slate-800 leading-tight">Halo</span>
            <span id="userDisplayName" class="text-xs font-bold text-slate-800 leading-tight">User</span>
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          </div>
        </div>
        <div class="w-8 h-8 bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-full flex items-center justify-center font-extrabold text-xs shadow-xs shrink-0" id="userAvatar">
          U
        </div>
      </div>
      </header>

    <!-- Main Content Area -->
    <main class="flex-1 px-4 py-4 space-y-3 flex flex-col">

      <!-- Bar Koneksi Printer Bluetooth Thermal -->
      <section class="bg-slate-900 text-white rounded-2xl p-3.5 shadow-md flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div id="printerIndicator" class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
          <span id="printerStatusText" class="text-xs text-slate-300 font-medium">Printer Belum Terhubung</span>
        </div>
        <button onclick="connectPrinter()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-xs">
          <i data-lucide="bluetooth" class="w-3.5 h-3.5"></i>
          <span>Konek Printer</span>
        </button>
      </section>

      <!-- Layar Display Hitung Dibuat Besar -->
      <section class="bg-slate-900 text-white rounded-2xl p-5 shadow-md space-y-2 min-h-[140px] flex flex-col justify-between">
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Layar Hitung Belanja</span>
        <div id="calcDisplay" class="text-4xl font-extrabold tracking-wider text-right text-emerald-400 overflow-x-auto py-2">0</div>
      </section>



      <!-- Papan Tombol Kalkulator -->
      <section class="grid grid-cols-4 gap-2 bg-slate-100 p-3 rounded-2xl border border-slate-200 shadow-inner">
        
        <!-- Baris 1: AC, Backspace, %, Bagi -->
        <button onclick="clearAll()" class="bg-red-100 text-red-700 hover:bg-red-200 font-extrabold py-3.5 rounded-xl text-sm transition shadow-2xs">AC</button>
        <button onclick="backspace()" class="bg-amber-100 text-amber-800 hover:bg-amber-200 font-extrabold py-3.5 rounded-xl text-sm transition shadow-2xs flex items-center justify-center" title="Hapus per digit">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
        <button onclick="appendOperator('%')" class="bg-slate-200 text-slate-700 hover:bg-slate-300 font-extrabold py-3.5 rounded-xl text-base transition shadow-2xs">%</button>
        <button onclick="appendOperator('/')" class="bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-extrabold py-3.5 rounded-xl text-base transition shadow-2xs">÷</button>

        <!-- Baris 2: 7, 8, 9, Kali -->
        <button onclick="appendNumber('7')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">7</button>
        <button onclick="appendNumber('8')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">8</button>
        <button onclick="appendNumber('9')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">9</button>
        <button onclick="appendOperator('*')" class="bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-extrabold py-3.5 rounded-xl text-base transition shadow-2xs">×</button>

        <!-- Baris 3: 4, 5, 6, Kurang (-) -->
        <button onclick="appendNumber('4')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">4</button>
        <button onclick="appendNumber('5')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">5</button>
        <button onclick="appendNumber('6')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">6</button>
        <button onclick="appendOperator('-')" class="bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-extrabold py-3.5 rounded-xl text-base transition shadow-2xs">-</button>

        <!-- Baris 4 & 5: 1, 2, 3, dan Tombol + Memanjang -->
        <button onclick="appendNumber('1')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">1</button>
        <button onclick="appendNumber('2')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">2</button>
        <button onclick="appendNumber('3')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">3</button>
        
        <!-- Tombol + Besar Memanjang Kebawah -->
        <button onclick="appendOperator('+')" class="bg-emerald-600 text-white hover:bg-emerald-700 font-extrabold rounded-xl text-2xl transition shadow-md col-start-4 row-start-4 row-span-2 flex items-center justify-center">+</button>

        <!-- Baris 5: 0, 000, Titik -->
        <button onclick="appendNumber('0')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">0</button>
        <button onclick="appendNumber('000')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-base transition shadow-2xs border border-slate-200">000</button>
        <button onclick="appendNumber('.')" class="bg-white text-slate-800 hover:bg-slate-50 font-extrabold py-3.5 rounded-xl text-xl transition shadow-2xs border border-slate-200">.</button>

        <!-- Baris 6: Tombol Cetak Struk (Memanjang 3 Kolom) Sejajar dengan Tombol = -->
        <button onclick="printAndSaveTransaction()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 rounded-xl text-xs transition shadow-md col-span-3 flex items-center justify-center gap-1.5">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>Cetak Struk</span>
        </button>
        
        <!-- Tombol = Sejajar dengan Tombol Cetak Struk -->
        <button onclick="calculateResult()" class="bg-blue-600 text-white hover:bg-blue-500 font-extrabold py-3.5 rounded-xl text-xl transition shadow-md col-start-4 row-start-6">=</button>

      </section>

    </main>

    <!-- Fixed Bottom Navigation -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-4 py-2.5 flex justify-around items-center z-30 shadow-lg">
      <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-600 font-medium transition-colors">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] tracking-tight">Beranda</span>
      </a>
      <a href="kalkulator.html" class="flex flex-col items-center gap-1 text-emerald-700 font-bold transition-colors">
        <i data-lucide="calculator" class="w-5 h-5 stroke-[2.5]"></i>
        <span class="text-[10px] tracking-tight">Kalkulator</span>
      </a>
      <a href="shift-orders.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-600 font-medium transition-colors">
        <i data-lucide="clock" class="w-5 h-5"></i>
        <span class="text-[10px] tracking-tight">Shift Order</span>
      </a>
      <a href="display.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-600 font-medium transition-colors">
        <i data-lucide="qr-code" class="w-5 h-5"></i>
        <span class="text-[10px] tracking-tight">QR Absen</span>
      </a>
      <a href="handover.html" class="flex flex-col items-center gap-1 text-amber-600 hover:text-amber-700 font-bold transition-colors">
        <i data-lucide="log-out" class="w-5 h-5"></i>
        <span class="text-[10px] tracking-tight">Tutup Shift</span>
      </a>
    </nav>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFE3WgH_LLlbArD7osR4OhtKwlNSmjpKvVvQq-_o8lKbI9Y-3_llKHRZzL_q1-i9Bcxg/exec";
    let currentInput = "0";
    let lastCalculatedExpression = ""; 
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    function updateDisplay() {
      document.getElementById('calcDisplay').textContent = currentInput;
    }
    function appendNumber(num) {
      if (currentInput === "0" && num !== ".") {
        currentInput = num;
      } else {
        currentInput += num;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1);
      }
      currentInput += op;
      updateDisplay();
    }

    function clearAll() {
      currentInput = "0";
      lastCalculatedExpression = "";
      updateDisplay();
    }

    function backspace() {
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = "0";
      }
      updateDisplay();
    }

    function calculateResult() {
      try {
        lastCalculatedExpression = currentInput; // Simpan rincian ekspresi hitungan
        let expression = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
        let result = eval(expression);
        
        currentInput = String(result);
        updateDisplay();
      } catch (error) {
        currentInput = "Error";
        updateDisplay();
        setTimeout(clearAll, 1500);
      }
    }

    async function connectPrinter() {
      try {
        if (!navigator.bluetooth) {
          alert("❌ Browser tidak mendukung Web Bluetooth.");
          return;
        }

        document.getElementById('printerStatusText').textContent = 'Mencari Printer...';
        
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
        });

        const server = await bluetoothDevice.gatt.connect();
        const services = await server.getPrimaryServices();
        
        for (const service of services) {
          const characteristics = await service.getCharacteristics();
          for (const char of characteristics) {
            if (char.properties.write || char.properties.writeWithoutResponse) {
              bluetoothCharacteristic = char;
              break;
            }
          }
          if (bluetoothCharacteristic) break;
        }

        if (!bluetoothCharacteristic) throw new Error("Karakteristik printer tidak ditemukan.");

        document.getElementById('printerIndicator').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
        document.getElementById('printerStatusText').textContent = `Terhubung: ${bluetoothDevice.name || 'Printer Thermal'}`;
        alert("✅ Printer Bluetooth berhasil terhubung!");

      } catch (error) {
        document.getElementById('printerIndicator').className = 'w-2.5 h-2.5 rounded-full bg-red-500';
        document.getElementById('printerStatusText').textContent = 'Gagal Terhubung';
        alert("❌ Gagal konek printer: " + error.message);
      }
    }

    // KETIKA TOMBOL CETAK DIPENCET: CETAK KE THERMAL + KIRIM KE SPREADSHEET (TAB TRANSAKSI)
    async function printAndSaveTransaction() {
      if (!bluetoothCharacteristic) {
        alert("⚠️ Printer belum terhubung! Klik 'Konek Printer' terlebih dahulu.");
        return;
      }

      const session = JSON.parse(localStorage.getItem('sipasar_session')) || { username: 'Kasir' };
      const idTransaksi = 'TRX-' + Date.now().toString().slice(-8);
      
      const now = new Date();
      const dateStr = now.toLocaleDateString('id-ID');
      const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      
      const waktuSpreadsheet = now.getFullYear() + '-' + 
                               String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                               String(now.getDate()).padStart(2, '0') + ' ' + 
                               String(now.getHours()).padStart(2, '0') + ':' + 
                               String(now.getMinutes()).padStart(2, '0') + ':' + 
                               String(now.getSeconds()).padStart(2, '0');

      let rincianItem = lastCalculatedExpression ? lastCalculatedExpression : currentInput;
      let totalBelanja = currentInput;

      // 1. Kirim Data ke Spreadsheet (Tab Transaksi)
      try {
        fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'save_calculator_log',
            idTransaksi: idTransaksi,
            waktu: waktuSpreadsheet,
            rincian: rincianItem,
            totalHasil: totalBelanja
          })
        }).catch(err => console.log('Sync spreadsheet error:', err));
      } catch (e) {
        console.log(e);
      }

      // 2. Cetak Struk Fisik via Printer Thermal Bluetooth
      try {
        let encoder = new TextEncoder();
        let commands = [];

        commands.push(new Uint8Array([0x1B, 0x40]));
        commands.push(new Uint8Array([0x1B, 0x61, 0x01]));
        commands.push(encoder.encode("TOKO RAJA SAYUR\n"));
        commands.push(encoder.encode("==============================\n"));
        
        commands.push(new Uint8Array([0x1B, 0x61, 0x00]));
        commands.push(encoder.encode(`ID TRX  : ${idTransaksi}\n`));
        commands.push(encoder.encode(`Tanggal : ${dateStr} ${timeStr}\n`));
        commands.push(encoder.encode(`Kasir   : ${session.username}\n`));
        commands.push(encoder.encode("------------------------------\n"));
        commands.push(encoder.encode(`RINCIAN ITEM:\n${rincianItem}\n`));
        commands.push(encoder.encode("------------------------------\n"));
        commands.push(encoder.encode(`TOTAL BELANJA : ${totalBelanja}\n`));
        commands.push(encoder.encode("==============================\n"));
        commands.push(new Uint8Array([0x1B, 0x61, 0x01]));
        commands.push(encoder.encode("Terima Kasih Sudah Berbelanja!\n\n\n"));
        commands.push(new Uint8Array([0x1D, 0x56, 0x41, 0x10]));

        for (let cmd of commands) {
          await bluetoothCharacteristic.writeValue(cmd);
        }

        alert("🖨️ Struk berhasil dicetak!");
      } catch (error) {
        alert("❌ Gagal mencetak struk thermal: " + error.message);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });

    document.addEventListener("DOMContentLoaded", function () {
      // Pembacaan Sesi Login dari localStorage
      const session = JSON.parse(localStorage.getItem('sipasar_session'));
            // Tampilkan username di kanan atas
      const username = session.username;
      document.getElementById('userDisplayName').textContent = username;
      
      // Inisial Avatar (huruf depan username)
      document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();
    });
  </script>
</body>
</html>
