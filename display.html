<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SI PASAR - Layar Presensi</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 flex justify-center items-start antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Main Container Simulator -->
  <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-24 border-x border-slate-200/80">

    <!-- Header -->
    <header class="px-5 py-4 bg-white/95 backdrop-blur-md sticky top-0 z-20 border-b border-slate-100 flex justify-between items-center shadow-xs">
      <div class="flex items-center gap-1">
        <span class="font-extrabold text-2xl tracking-tight text-amber-500">SI</span>
        <span class="font-extrabold text-2xl tracking-tight text-emerald-700">PASAR</span>
      </div>
      <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-800 px-3 py-1.5 rounded-full text-xs font-semibold border border-emerald-100">
        <i data-lucide="qr-code" class="w-3.5 h-3.5 text-emerald-600"></i>
        <span>Display Presensi</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-5 py-6 text-center flex flex-col items-center justify-center">
      <h1 class="text-xl font-bold text-slate-800 mb-1">Presensi Karyawan</h1>
      <p class="text-xs text-slate-500 mb-6">Scan kode ini dari HP Anda untuk absen masuk/pulang</p>

      <div class="bg-emerald-50 border border-emerald-100 rounded-3xl p-6 shadow-md inline-block">
        <div id="qr" class="w-64 h-64 flex items-center justify-center text-slate-400 bg-white rounded-2xl shadow-inner"></div>
      </div>

      <div class="w-full mt-6 h-2 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
        <div id="bar" class="h-full bg-emerald-500 transition-all duration-300" style="width:100%"></div>
      </div>
      <p id="status" class="mt-3 text-xs font-medium text-slate-500">Memuat kode…</p>
      <p id="clock" class="mt-4 text-3xl font-extrabold tabular-nums text-slate-800 tracking-tight"></p>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-6 py-2.5 flex justify-around items-center z-30 shadow-lg">
      <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-600 font-medium transition-colors">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] tracking-tight">Beranda</span>
      </a>
      <a href="kalkulator.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-600 font-medium transition-colors">
        <i data-lucide="calculator" class="w-5 h-5"></i>
        <span class="text-[10px] tracking-tight">Kalkulator</span>
      </a>
      <a href="display.html" class="flex flex-col items-center gap-1 text-emerald-700 font-bold transition-colors">
        <i data-lucide="qr-code" class="w-5 h-5 stroke-[2.5]"></i>
        <span class="text-[10px] tracking-tight">QR Absen</span>
      </a>
    </nav>

  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz2zyMqt105qkzPrZoPmOJ-odo1OTla3IT3oavvR6oMbtMmy_jzln4eHnPLaJDpmk3J/exec';
    const REFRESH_MS = 5000;

    const qrEl = document.getElementById('qr');
    const barEl = document.getElementById('bar');
    const statusEl = document.getElementById('status');
    let qr = null;
    let lastRefresh = 0;

    async function refreshQR() {
      try {
        const res = await fetch(API_URL + '?action=token&_=' + Date.now());
        const data = await res.json();
        if (!data.ok) throw new Error(data.message || 'Gagal mengambil token');
        if (!qr) {
          qrEl.textContent = '';
          qr = new QRCode(qrEl, { text: data.token, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
        } else {
          qr.clear();
          qr.makeCode(data.token);
        }
        lastRefresh = Date.now();
        statusEl.textContent = 'Kode berganti otomatis setiap 5 detik';
      } catch (err) {
        statusEl.textContent = 'Gagal memuat kode. Periksa koneksi internet.';
      }
    }

    function tick() {
      const elapsed = Date.now() - lastRefresh;
      barEl.style.width = Math.max(0, 100 - (elapsed / REFRESH_MS) * 100) + '%';
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('id-ID', { hour12: false });
      requestAnimationFrame(tick);
    }

    refreshQR();
    setInterval(refreshQR, REFRESH_MS);
    tick();

    document.addEventListener("DOMContentLoaded", () => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
  </script>
</body>
</html>
